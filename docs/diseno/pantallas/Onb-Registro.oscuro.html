<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PawBook móvil — Registro</title>

<link rel="stylesheet" href="pb-dark.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4361A}a:hover{color:#8A2912}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div class="pb-dark" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF9F6; color: #1C1917; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 24px 24px; gap: 20px; overflow: hidden;">

  <div style="display: flex; align-items: center; gap: 8px;">
    <div style="width: 36px; height: 36px; border-radius: 12px; background: #FF5A36; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6.5" cy="9.5" r="2"/><circle cx="10" cy="5.5" r="2"/><circle cx="14.5" cy="5.5" r="2"/><circle cx="18" cy="9.5" r="2"/><path d="M7.5 16.5c.8-3 2.6-4.8 4.5-4.8s3.7 1.8 4.5 4.8c.5 1.9-.8 3.5-2.6 3.5-.9 0-1.3-.5-1.9-.5s-1 .5-1.9.5c-1.8 0-3.1-1.6-2.6-3.5z"/></svg>
    </div>
    <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em;">PawBook</span>
  </div>

  <div aria-hidden="true" style="display: flex; align-items: center; padding: 4px 0;">
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #E5DEFF; border: 4px solid #FAF9F6;"></span>
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #FDE3D8; border: 4px solid #FAF9F6; margin-left: -16px;"></span>
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #DCE7F3; border: 4px solid #FAF9F6; margin-left: -16px;"></span>
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #D7EFE4; border: 4px solid #FAF9F6; margin-left: -16px;"></span>
    <span style="width: 64px; height: 64px; border-radius: 32px; background: #F4D9B8; border: 4px solid #FAF9F6; margin-left: -16px;"></span>
  </div>

  <div>
    <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.12; letter-spacing: -0.03em;">La red social donde tu mascota es la protagonista</h1>
    <p style="margin: 10px 0 0; font-size: 15px; line-height: 1.45; color: #44403C;">Comparte su día a día, encuentra compañeros de paseo cerca y apoya la adopción responsable.</p>
  </div>

  <button style="height: 52px; border-radius: 16px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #1C1917; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
    <span aria-hidden="true" style="width: 24px; height: 24px; border-radius: 12px; border: 1.5px solid #1C1917; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center;">G</span>
    Continuar con Google</button>

  <div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #57534E;">
    <span style="flex-grow: 1; height: 1px; background: #E7E5E4;"></span>o con tu correo<span style="flex-grow: 1; height: 1px; background: #E7E5E4;"></span>
  </div>

  <form style="display: flex; flex-direction: column; gap: 12px;">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Correo electrónico
      <input type="email" placeholder="tu@correo.com" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 16px; color: #1C1917; outline: none;">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Contraseña
      <input type="password" placeholder="Mínimo 8 caracteres" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 16px; color: #1C1917; outline: none;">
    </label>
    <label style="display: flex; align-items: flex-start; gap: 10px; font-size: 13px; line-height: 1.4; color: #44403C;">
      <input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #D63A1A; flex-shrink: 0;">
      <span>Confirmo que tengo [EDAD MÍNIMA] años o más y acepto los <a href="#" style="font-weight: 600;">Términos</a> y la <a href="#" style="font-weight: 600;">Política de privacidad</a>.</span>
    </label>
    <button type="button" style="height: 52px; border-radius: 16px; border: none; background: #D63A1A; color: #FFFFFF; font-size: 15px; font-weight: 700;">Crear cuenta</button>
    <p style="margin: 0; font-size: 12px; color: #57534E; text-align: center;">Te enviaremos un enlace para verificar tu correo antes de publicar.</p>
  </form>

  <div style="margin-top: auto; text-align: center; font-size: 14px; color: #44403C;">¿Ya tienes cuenta? <a href="#" style="font-weight: 700; text-decoration: none;">Inicia sesión</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return { theme: this.props.dark ? 'pb-dark' : '' };
  }
}
</script>
</body>
</html>
