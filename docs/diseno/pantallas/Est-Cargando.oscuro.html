<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PawBook móvil — Cargando feed</title>

<link rel="stylesheet" href="pb-dark.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div aria-busy="true" class="pb-dark" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF9F6; color: #1C1917; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative;">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <div style="width: 34px; height: 34px; border-radius: 11px; background: #FF5A36; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6.5" cy="9.5" r="2"/><circle cx="10" cy="5.5" r="2"/><circle cx="14.5" cy="5.5" r="2"/><circle cx="18" cy="9.5" r="2"/><path d="M7.5 16.5c.8-3 2.6-4.8 4.5-4.8s3.7 1.8 4.5 4.8c.5 1.9-.8 3.5-2.6 3.5-.9 0-1.3-.5-1.9-.5s-1 .5-1.9.5c-1.8 0-3.1-1.6-2.6-3.5z"/></svg>
      </div>
      <span style="font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 21px; letter-spacing: -0.02em;">PawBook</span>
    </div>
    <span style="width: 96px; height: 44px; border-radius: 22px; background: #EDEAE4;"></span>
  </header>

  <div style="display: flex; gap: 6px; padding: 4px 16px 12px;">
    <button style="height: 40px; padding: 0 18px; border-radius: 20px; border: none; background: #1C1917; color: #FFFFFF; font-size: 14px; font-weight: 700;">Para ti</button>
    <button style="height: 40px; padding: 0 18px; border-radius: 20px; border: 1px solid #E7E5E4; background: #FFFFFF; color: #44403C; font-size: 14px; font-weight: 600;">Siguiendo</button>
  </div>

  <div role="status" style="margin: 0 16px 12px; padding: 10px 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E5E4; display: flex; align-items: center; gap: 12px;">
    <div role="img" aria-label="Miniatura de la foto que se publica" style="width: 44px; height: 44px; border-radius: 10px; background: #E5DEFF; flex-shrink: 0;"></div>
    <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;">
      <div style="display: flex; justify-content: space-between; font-size: 13px;"><span style="font-weight: 700;">Publicando como Luna…</span><span style="color: #57534E; font-weight: 600;">60 %</span></div>
      <div style="height: 6px; border-radius: 3px; background: #F3F1EC; overflow: hidden;"><div style="width: 60%; height: 6px; background: #D63A1A;"></div></div>
    </div>
  </div>

  <main aria-label="Cargando publicaciones" style="flex-grow: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; overflow: hidden;">
    <div aria-hidden="true" style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 22px; overflow: hidden; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px;">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #EDEAE4;"></span>
        <div style="display: flex; flex-direction: column; gap: 6px;"><span style="width: 110px; height: 12px; border-radius: 6px; background: #EDEAE4;"></span><span style="width: 170px; height: 10px; border-radius: 5px; background: #F3F1EC;"></span></div>
      </div>
      <div style="height: 260px; background: #F3F1EC;"></div>
      <div style="padding: 14px; display: flex; flex-direction: column; gap: 8px;">
        <span style="width: 92%; height: 11px; border-radius: 6px; background: #EDEAE4;"></span>
        <span style="width: 64%; height: 11px; border-radius: 6px; background: #EDEAE4;"></span>
        <div style="display: flex; gap: 6px; margin-top: 4px;"><span style="width: 60px; height: 32px; border-radius: 16px; background: #F3F1EC;"></span><span style="width: 54px; height: 32px; border-radius: 16px; background: #F3F1EC;"></span><span style="width: 54px; height: 32px; border-radius: 16px; background: #F3F1EC;"></span></div>
      </div>
    </div>
    <div aria-hidden="true" style="background: #FFFFFF; border: 1px solid #E7E5E4; border-radius: 22px; overflow: hidden; flex-shrink: 0;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 14px;">
        <span style="width: 40px; height: 40px; border-radius: 20px; background: #EDEAE4;"></span>
        <div style="display: flex; flex-direction: column; gap: 6px;"><span style="width: 90px; height: 12px; border-radius: 6px; background: #EDEAE4;"></span><span style="width: 140px; height: 10px; border-radius: 5px; background: #F3F1EC;"></span></div>
      </div>
      <div style="height: 200px; background: #F3F1EC;"></div>
    </div>
  </main>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; box-sizing: border-box; padding: 6px 8px 14px; background: #FFFFFF; border-top: 1px solid #E7E5E4; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center;">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #B4361A; font-size: 11px; font-weight: 700;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #57534E; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>Buscar</a>
    <a href="#" aria-label="Publicar" style="justify-self: center; width: 54px; height: 54px; margin-top: -18px; border-radius: 18px; background: #D63A1A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(214,58,26,0.32);">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #57534E; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6.5" cy="9.5" r="1.6"/><circle cx="10" cy="5.5" r="1.6"/><circle cx="14.5" cy="5.5" r="1.6"/><circle cx="18" cy="9.5" r="1.6"/><path d="M7.5 16.5c.8-3 2.6-4.8 4.5-4.8s3.7 1.8 4.5 4.8c.5 1.9-.8 3.5-2.6 3.5-.9 0-1.3-.5-1.9-.5s-1 .5-1.9.5c-1.8 0-3.1-1.6-2.6-3.5z"/></svg>PawMates</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #57534E; font-size: 11px; font-weight: 600;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M12 17.5s-3-1.8-3-3.8a1.6 1.6 0 0 1 3-.8 1.6 1.6 0 0 1 3 .8c0 2-3 3.8-3 3.8z"/></svg>Adopción</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'pb-dark' : '' };
  }
}
</script>
</body>
</html>
