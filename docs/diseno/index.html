<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PawBook · Pantallas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#faf9f6; --surface:#fff; --ink:#1c1917; --muted:#57534e; --line:#e7e5e4; --inverse:#1c1917; --on-inverse:#fff; }
  :root[data-theme="dark"] { --bg:#151311; --surface:#1f1c1a; --ink:#f5f2ee; --muted:#a8a29e; --line:#36312d; --inverse:#f5f2ee; --on-inverse:#1c1917; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "DM Sans", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; padding: 16px; background: var(--bg); border-bottom: 1px solid var(--line); }
  h1 { margin: 0; font-family: "Plus Jakarta Sans", sans-serif; font-size: 22px; font-weight: 800; }
  header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
  .toggle { display: flex; gap: 4px; padding: 4px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); }
  .toggle button { height: 36px; padding: 0 16px; border: 0; border-radius: 999px; background: transparent; color: var(--ink); font: 600 14px "DM Sans", sans-serif; cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--inverse); color: var(--on-inverse); }
  main { max-width: 1400px; margin: 0 auto; padding: 8px 16px 48px; }
  h2 { margin: 32px 0 12px; font-family: "Plus Jakarta Sans", sans-serif; font-size: 18px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }
  figure { margin: 0; }
  figcaption { display: flex; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  figcaption a { color: inherit; font-weight: 600; }
  .frame { overflow: hidden; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
  .frame iframe { border: 0; transform-origin: 0 0; display: block; }
  .mobile .frame { width: 195px; height: 422px; }
  .mobile iframe { width: 390px; height: 844px; transform: scale(0.5); }
  .desktop .frame { width: min(100%, 576px); aspect-ratio: 1440 / 1000; }
  .desktop iframe { width: 1440px; height: 2500px; transform: scale(0.4); }
  .desktop { width: min(100%, 576px); }
</style>
</head>
<body>
<header>
  <div>
    <h1>PawBook · Pantallas</h1>
    <p>Copia local del lienzo de diseño. Funciona sin conexión (salvo las fuentes de Google).</p>
  </div>
  <div class="toggle" role="group" aria-label="Tema de las pantallas">
    <button type="button" data-theme-choice="light" aria-pressed="true">Claro</button>
    <button type="button" data-theme-choice="dark" aria-pressed="false">Oscuro</button>
  </div>
</header>
<main id="galeria"></main>
<script>
  // Cada pantalla existe en dos archivos: nombre.html (claro) y nombre.oscuro.html.
  const SECTIONS = [
    { title: "Móvil", items: [
      ["Main", "Feed", "mobile"], ["Mobile-Perfil", "Perfil de mascota", "mobile"],
      ["Mobile-PawMates", "PawMates", "mobile"], ["Mobile-Adopcion", "Adopción", "mobile"],
      ["Mobile-Chat", "Chat PawMates", "mobile"] ] },
    { title: "Desktop", items: [
      ["Desktop-Feed", "Feed (3 columnas)", "desktop"], ["Desktop-Adopcion", "Adopción", "desktop"],
      ["Desktop-Mensajes", "Mensajes", "desktop"] ] },
    { title: "Onboarding y registro", items: [
      ["Onb-Registro", "1 · Registro", "mobile"], ["Onb-Mascota", "2 · Crear mascota", "mobile"],
      ["Onb-Seguir", "3 · Mascotas para seguir", "mobile"], ["Desktop-Registro", "Registro (desktop)", "desktop"] ] },
    { title: "Estados vacíos, de carga y de error", items: [
      ["Est-FeedVacio", "Feed vacío", "mobile"], ["Est-Cargando", "Cargando", "mobile"],
      ["Est-PawMatesOff", "PawMates sin ubicación", "mobile"], ["Est-Error", "Error y degradación", "mobile"],
      ["Est-Catalogo", "Catálogo de estados (desktop)", "desktop"] ] },
  ];

  const main = document.getElementById("galeria");
  for (const section of SECTIONS) {
    const h2 = document.createElement("h2");
    h2.textContent = section.title;
    const grid = document.createElement("div");
    grid.className = "grid";
    for (const [file, label, kind] of section.items) {
      const figure = document.createElement("figure");
      figure.className = kind;
      figure.innerHTML = `<div class="frame"><iframe title="${label}" loading="lazy" data-file="${file}" src="pantallas/${file}.html"></iframe></div>
        <figcaption><span>${label}</span><a data-file="${file}" href="pantallas/${file}.html" target="_blank">Abrir</a></figcaption>`;
      grid.append(figure);
    }
    main.append(h2, grid);
  }

  function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    const suffix = theme === "dark" ? ".oscuro.html" : ".html";
    for (const el of document.querySelectorAll("iframe[data-file]")) el.src = `pantallas/${el.dataset.file}${suffix}`;
    for (const el of document.querySelectorAll("a[data-file]")) el.href = `pantallas/${el.dataset.file}${suffix}`;
    for (const button of document.querySelectorAll("[data-theme-choice]")) {
      button.setAttribute("aria-pressed", String(button.dataset.themeChoice === theme));
    }
  }
  for (const button of document.querySelectorAll("[data-theme-choice]")) {
    button.addEventListener("click", () => applyTheme(button.dataset.themeChoice));
  }
</script>
</body>
</html>
