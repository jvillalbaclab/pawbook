<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>PawBook móvil — Crear mascota</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/843abdf07b44834f175ef7dca06259a2">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4361A}a:hover{color:#8A2912}
button,input,select{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF9F6; color: #1C1917; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 16px 0 8px;">
    <a href="Onb-Registro.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 14px; color: #1C1917; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px;" role="progressbar" aria-valuemin="1" aria-valuemax="3" aria-valuenow="2" aria-label="Paso 2 de 3">
      <span style="height: 6px; border-radius: 3px; background: #D63A1A;"></span>
      <span style="height: 6px; border-radius: 3px; background: #D63A1A;"></span>
      <span style="height: 6px; border-radius: 3px; background: #E7E5E4;"></span>
    </div>
    <span style="font-size: 12px; font-weight: 700; color: #57534E; margin-left: 6px;">2 de 3</span>
  </header>

  <form style="flex-grow: 1; padding: 18px 24px 0; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <h1 style="margin: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.02em;">Presenta a tu mascota</h1>
      <p style="margin: 6px 0 0; font-size: 14px; color: #44403C;">Será la autora de todo lo que publiques. Podrás añadir más mascotas después.</p>
    </div>

    <div style="display: flex; align-items: center; gap: 14px;">
      <button type="button" aria-label="Añadir foto de perfil" style="width: 84px; height: 84px; border-radius: 42px; border: 2px dashed #A8A29E; background: #FFFFFF; color: #57534E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; flex-shrink: 0;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Foto</button>
      <fieldset style="border: none; margin: 0; padding: 0; flex-grow: 1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
        <legend style="font-size: 13px; font-weight: 700; margin-bottom: 6px; padding: 0;">Especie</legend>
        <button type="button" aria-pressed="false" style="height: 56px; border-radius: 16px; border: 1px solid #D6D3D1; background: #FFFFFF; color: #44403C; font-size: 15px; font-weight: 600;">Perro</button>
        <button type="button" aria-pressed="true" style="height: 56px; border-radius: 16px; border: 2px solid #1C1917; background: #FFFFFF; color: #1C1917; font-size: 15px; font-weight: 800;">Gato</button>
      </fieldset>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Nombre
      <input type="text" value="Luna" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 16px; color: #1C1917; outline: none;">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Usuario
      <span style="display: flex; align-items: center; height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #059669; background: #FFFFFF;">
        <span style="font-size: 16px; color: #57534E; font-weight: 500;">@</span>
        <input type="text" value="luna.gata" style="flex-grow: 1; min-width: 0; border: none; outline: none; background: transparent; font-size: 16px; color: #1C1917;">
        <span style="font-size: 12px; font-weight: 700; color: #065F46;">Disponible</span>
      </span>
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Raza
      <select style="height: 48px; padding: 0 12px; border-radius: 14px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 16px; color: #1C1917;">
        <option>Siamesa</option>
        <option>Mestiza</option>
        <option>No lo sé</option>
      </select>
    </label>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700;">Nacimiento aprox.
        <input type="text" value="Mar 2023" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1px solid #D6D3D1; background: #FFFFFF; font-size: 16px; color: #1C1917; outline: none; min-width: 0;">
      </label>
      <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;">
        <legend style="font-size: 13px; font-weight: 700; padding: 0; margin-bottom: 6px;">Sexo</legend>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); height: 48px; padding: 3px; box-sizing: border-box; border-radius: 14px; background: #F3F1EC;">
          <button type="button" aria-pressed="true" style="border: none; border-radius: 11px; background: #FFFFFF; color: #1C1917; font-size: 14px; font-weight: 700;">Hembra</button>
          <button type="button" aria-pressed="false" style="border: none; border-radius: 11px; background: transparent; color: #44403C; font-size: 14px; font-weight: 600;">Macho</button>
        </div>
      </fieldset>
    </div>
  </form>

  <footer style="padding: 14px 24px 24px; display: flex; flex-direction: column; gap: 8px;">
    <a href="Onb-Seguir.dc.html" style="height: 52px; border-radius: 16px; background: #D63A1A; color: #FFFFFF; text-decoration: none; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center;">Continuar</a>
    <span style="font-size: 12px; color: #57534E; text-align: center;">La bio y más fotos se añaden luego desde el perfil.</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: this.props.dark ? 'pb-dark' : '' };
  }
}
</script>
</body>
</html>
