<style>
/* Layout: cabecera con avance global, franja de hitos fija, lista de tareas agrupada por hito y sección */
:root {
  --bg: #FAF9F6;
  --surface: #FFFFFF;
  --sunken: #F3F1EC;
  --line: #E6E2DA;
  --fg: #1C1917;
  --muted: #6B645C;
  --faint: #A39C93;
  --accent: #FF5A36;
  --accent-ink: #C2381A;
  --accent-soft: #FFE9E2;
  --done: #0F7A55;
  --done-soft: #DDF3EA;
  --warn: #9A6200;
  --warn-soft: #FDF0D5;
  --repo-api: #3B5BDB; --repo-api-bg: #E7ECFF;
  --repo-web: #0C7C8C; --repo-web-bg: #DDF4F6;
  --repo-ops: #7048C2; --repo-ops-bg: #EFE8FC;
  --repo-docs: #5E6B2A; --repo-docs-bg: #EEF2DC;
  --repo-socios: #B4471E; --repo-socios-bg: #FCE9DF;
  --font-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "DM Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15120F; --surface: #1E1A16; --sunken: #26211C; --line: #352E27;
    --fg: #F3EFE9; --muted: #B2A99E; --faint: #7D746A;
    --accent: #FF6E4D; --accent-ink: #FF9A82; --accent-soft: #3A1E16;
    --done: #4CC796; --done-soft: #11301F; --warn: #F0B54A; --warn-soft: #33270F;
    --repo-api: #9DB0FF; --repo-api-bg: #1D2547;
    --repo-web: #6FD3E0; --repo-web-bg: #0E2E33;
    --repo-ops: #C4A8FF; --repo-ops-bg: #2A1F45;
    --repo-docs: #C7D58A; --repo-docs-bg: #262B14;
    --repo-socios: #FFAE8A; --repo-socios-bg: #3A2016;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15120F; --surface: #1E1A16; --sunken: #26211C; --line: #352E27;
  --fg: #F3EFE9; --muted: #B2A99E; --faint: #7D746A;
  --accent: #FF6E4D; --accent-ink: #FF9A82; --accent-soft: #3A1E16;
  --done: #4CC796; --done-soft: #11301F; --warn: #F0B54A; --warn-soft: #33270F;
  --repo-api: #9DB0FF; --repo-api-bg: #1D2547;
  --repo-web: #6FD3E0; --repo-web-bg: #0E2E33;
  --repo-ops: #C4A8FF; --repo-ops-bg: #2A1F45;
  --repo-docs: #C7D58A; --repo-docs-bg: #262B14;
  --repo-socios: #FFAE8A; --repo-socios-bg: #3A2016;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 15px; line-height: 1.5;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 64px;
  display: flex; flex-direction: column; gap: 24px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

/* Cabecera */
.head { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent-ink); }
h1 { font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -.02em; margin-top: 4px; }
.sub { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.overall { text-align: right; min-width: 0; }
.overall .pct { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.overall .pct small { font-size: 20px; color: var(--muted); font-weight: 700; }
.overall .count { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
.status[data-state="live"] .dot { background: var(--done); }
.status[data-state="warn"] .dot { background: var(--warn); }
.status[data-state="off"] .dot { background: var(--accent); }

/* Franja de hitos */
.strip {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 10px; margin-block: -10px;
  display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px;
}
.ms-chip {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  padding: 10px 10px 9px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); cursor: pointer; min-width: 0; text-decoration: none; color: inherit;
}
.ms-chip:hover { border-color: var(--faint); }
.ms-chip .k { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
.ms-chip .code { font-family: var(--font-mono); font-size: 12px; font-weight: 600; }
.ms-chip .n { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ms-chip .name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar { height: 5px; border-radius: 99px; background: var(--sunken); overflow: hidden; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s ease; }
.ms-chip[data-complete="true"] .bar > span { background: var(--done); }
.ms-chip[data-complete="true"] .code { color: var(--done); }
.ms-chip[data-gate="true"] { border-color: var(--done); }

/* Filtros */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters .search { flex: 1 1 220px; min-width: 0; padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.pill-btn { padding: 7px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 13px; }
.pill-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* Hito */
.milestone { scroll-margin-top: 110px; display: flex; flex-direction: column; gap: 14px; }
.ms-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.ms-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.01em; }
.ms-head .weeks { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.ms-head .goal { color: var(--muted); margin: 4px 0 0; max-width: 70ch; }
.ms-head .tally { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); white-space: nowrap; }
.section h3 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 6px 0 6px; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.item { display: grid; grid-template-columns: auto auto 1fr; gap: 4px 12px; align-items: start; padding: 11px 14px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item[data-done="true"] .text { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }
.check {
  appearance: none; width: 20px; height: 20px; margin: 1px 0 0; border-radius: 6px;
  border: 1.5px solid var(--faint); background: var(--surface); cursor: pointer; display: grid; place-items: center;
}
.check:checked { background: var(--done); border-color: var(--done); }
.check:checked::after { content: ""; width: 10px; height: 6px; border-left: 2px solid var(--surface); border-bottom: 2px solid var(--surface); transform: rotate(-45deg) translate(1px, -1px); }
.check:disabled { cursor: not-allowed; opacity: .55; }
.tid { font-family: var(--font-mono); font-size: 12px; color: var(--muted); padding-top: 2px; white-space: nowrap; }
.body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.text { overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.repo { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 6px; }
.repo.api { color: var(--repo-api); background: var(--repo-api-bg); }
.repo.web { color: var(--repo-web); background: var(--repo-web-bg); }
.repo.ops { color: var(--repo-ops); background: var(--repo-ops-bg); }
.repo.docs { color: var(--repo-docs); background: var(--repo-docs-bg); }
.repo.socios { color: var(--repo-socios); background: var(--repo-socios-bg); }
.refs { font-family: var(--font-mono); font-size: 11px; color: var(--faint); overflow-wrap: anywhere; }
.who { display: inline-flex; align-items: center; gap: 5px; color: var(--done); }
.who img { width: 16px; height: 16px; border-radius: 50%; }

/* Puerta de salida */
.gate { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 12px 14px 6px; background: var(--sunken); }
.gate[data-open="true"] { border-style: solid; border-color: var(--done); background: var(--done-soft); }
.gate h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; display: flex; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
.gate .list { background: transparent; border: 0; }
.gate .item { padding: 8px 0; grid-template-columns: auto 1fr; border-top-color: var(--line); }
.gate .lock { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--muted); }
.gate[data-open="true"] .lock { color: var(--done); }

.empty { padding: 18px; color: var(--muted); text-align: center; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 10px 14px; font-size: 13px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }

@media (max-width: 860px) {
  .strip { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .head { grid-template-columns: 1fr; }
  .overall { text-align: left; }
}
@media (max-width: 480px) {
  .item { grid-template-columns: auto 1fr; }
  .tid { grid-column: 2; grid-row: 1; }
  .item .body { grid-column: 2; }
  .ms-chip .name { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar > span { transition: none; } }
</style>

<script>
(function () {
  "use strict";
  const PLAN = JSON.parse(document.getElementById("plan-data").textContent);
  const REPOS = ["api", "web", "ops", "docs", "socios"];
  const SHORT = { f0: "F0", sp: "Spike", m0: "M0", m1: "M1", m2: "M2", m3: "M3", b: "Beta", l: "Lanz." };

  const state = {};            // id -> {done, by, at}
  const ui = { pending: false, repos: new Set(), q: "" };
  let db = null, user = null, canWrite = false, myId = null;
  const saving = new Set();

  const allTasks = [];
  PLAN.forEach(m => m.sections.forEach(s => s.tasks.forEach(t => allTasks.push(Object.assign({ ms: m.id }, t)))));

  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const isDone = id => !!(state[id] && state[id].done);

  function setStatus(kind, text) { $("status").dataset.state = kind; $("status-text").textContent = text; }

  // Filtros
  REPOS.forEach(r => {
    const b = el("button", "pill-btn", r);
    b.type = "button"; b.setAttribute("aria-pressed", "false"); b.dataset.repo = r;
    b.addEventListener("click", () => {
      ui.repos.has(r) ? ui.repos.delete(r) : ui.repos.add(r);
      b.setAttribute("aria-pressed", String(ui.repos.has(r))); render();
    });
    $("repo-filters").appendChild(b);
  });
  $("f-pending").addEventListener("click", e => { ui.pending = !ui.pending; e.currentTarget.setAttribute("aria-pressed", String(ui.pending)); render(); });
  $("search").addEventListener("input", e => { ui.q = e.target.value.trim().toLowerCase(); render(); });

  function matches(t) {
    if (ui.pending && isDone(t.id)) return false;
    if (ui.repos.size && !t.repos.some(r => ui.repos.has(r))) return false;
    if (ui.q) {
      const hay = (t.id + " " + t.text + " " + t.refs + " " + t.repos.join(" ")).toLowerCase();
      if (!hay.includes(ui.q)) return false;
    }
    return true;
  }

  function msStats(m) {
    let total = 0, done = 0;
    m.sections.forEach(s => s.tasks.forEach(t => { total++; if (isDone(t.id)) done++; }));
    const gDone = m.gates.filter(g => isDone(g.id)).length;
    return { total, done, gates: m.gates.length, gDone, gateOpen: m.gates.length > 0 && gDone === m.gates.length };
  }

  async function toggle(id, checked) {
    if (!db || !canWrite || saving.has(id)) return;
    saving.add(id);
    const prev = state[id];
    state[id] = checked ? { done: true, by: myId, at: new Date().toISOString() } : { done: false };
    render();
    try {
      await db.collection("estado").doc(id).set(state[id]);
    } catch (err) {
      state[id] = prev; render();
      if (err && err.code === "invalid_argument") { canWrite = false; showNote("No tienes permiso para marcar tareas en este tablero. Pide al propietario acceso de colaborador."); render(); }
      else showNote("No se pudo guardar el cambio. Revisa tu conexión y vuelve a intentarlo.");
    } finally { saving.delete(id); }
  }

  function showNote(text) { const n = $("note"); n.textContent = text; n.hidden = !text; }

  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString("es", { day: "numeric", month: "short" }); } catch (e) { return ""; }
  }

  function row(item, opts, profiles) {
    const li = el("li", "item");
    li.dataset.done = String(isDone(item.id));
    const cb = el("input", "check");
    cb.type = "checkbox"; cb.id = "cb-" + item.id; cb.checked = isDone(item.id);
    cb.disabled = !canWrite;
    cb.setAttribute("aria-label", (opts.gate ? "Criterio de salida: " : item.id + ": ") + item.text);
    cb.addEventListener("change", () => toggle(item.id, cb.checked));
    li.appendChild(cb);
    if (!opts.gate) li.appendChild(el("span", "tid", item.id));
    const body = el("div", "body");
    const label = el("label", "text", item.text); label.htmlFor = cb.id;
    body.appendChild(label);
    const meta = el("div", "meta");
    (item.repos || []).forEach(r => meta.appendChild(el("span", "repo " + r, r)));
    if (item.refs) meta.appendChild(el("span", "refs", item.refs));
    const st = state[item.id];
    if (st && st.done) {
      const who = el("span", "who");
      const p = st.by && profiles ? profiles[st.by] : null;
      if (p && p.avatarUrl) { const img = el("img"); img.src = p.avatarUrl; img.alt = ""; who.appendChild(img); }
      who.appendChild(el("span", null, "✓ " + ((p && p.name) || "Alguien del equipo") + (st.at ? " · " + fmtDate(st.at) : "")));
      meta.appendChild(who);
    }
    if (meta.childNodes.length) body.appendChild(meta);
    li.appendChild(body);
    return li;
  }

  let renderSeq = 0;
  async function render() {
    const seq = ++renderSeq;
    const ids = [...new Set(Object.values(state).filter(s => s && s.done && s.by).map(s => s.by))];
    let profiles = null;
    if (user && ids.length) { try { profiles = await user.profiles(ids); } catch (e) { profiles = null; } }
    if (seq !== renderSeq) return;

    // Totales
    const total = allTasks.length, done = allTasks.filter(t => isDone(t.id)).length;
    const pct = total ? Math.round(done / total * 100) : 0;
    $("pct").innerHTML = ""; $("pct").append(String(pct)); $("pct").appendChild(el("small", null, "%"));
    $("count").textContent = done + " de " + total + " tareas";

    // Franja
    const strip = $("strip"); strip.innerHTML = "";
    PLAN.forEach(m => {
      const s = msStats(m);
      const a = el("a", "ms-chip"); a.href = "#" + m.id;
      a.dataset.complete = String(s.total > 0 && s.done === s.total);
      a.dataset.gate = String(s.gateOpen);
      const k = el("div", "k"); k.append(el("span", "code", SHORT[m.id] || m.id), el("span", "n", s.done + "/" + s.total));
      const bar = el("div", "bar"); const fill = el("span"); fill.style.width = (s.total ? s.done / s.total * 100 : 0) + "%"; bar.appendChild(fill);
      a.append(k, el("span", "name", m.title.replace(/^[A-Z0-9]+ — /, "")), bar);
      a.title = m.title + (s.gates ? " · puerta " + s.gDone + "/" + s.gates : "");
      strip.appendChild(a);
    });

    // Tablero
    const board = $("board"); board.innerHTML = "";
    const frag = document.createDocumentFragment();
    let shown = 0;
    PLAN.forEach(m => {
      const s = msStats(m);
      const sec = el("section", "milestone"); sec.id = m.id;
      const head = el("div", "ms-head");
      const left = el("div");
      left.appendChild(el("div", "weeks", m.weeks || "Tras la beta"));
      left.appendChild(el("h2", null, m.title));
      if (m.goal) left.appendChild(el("p", "goal", m.goal));
      head.append(left, el("div", "tally", s.done + " de " + s.total + " tareas" + (s.gates ? " · puerta " + s.gDone + "/" + s.gates : "")));
      sec.appendChild(head);
      let any = false;
      m.sections.forEach(sct => {
        const vis = sct.tasks.filter(matches);
        if (!vis.length) return;
        any = true; shown += vis.length;
        const box = el("div", "section");
        if (m.sections.length > 1 || sct.title !== "Tareas") box.appendChild(el("h3", null, sct.title));
        const ul = el("ul", "list");
        vis.forEach(t => ul.appendChild(row(t, {}, profiles)));
        box.appendChild(ul); sec.appendChild(box);
      });
      const filtering = ui.pending || ui.repos.size || ui.q;
      if (m.gates.length && !filtering) {
        const g = el("div", "gate"); g.dataset.open = String(s.gateOpen);
        const h = el("h3"); h.append(el("span", null, "Puerta de salida"), el("span", "lock", s.gateOpen ? "SUPERADA" : s.gDone + "/" + s.gates));
        g.appendChild(h);
        const ul = el("ul", "list");
        m.gates.forEach(gt => ul.appendChild(row(gt, { gate: true }, profiles)));
        g.appendChild(ul); sec.appendChild(g); any = true;
      }
      if (any) frag.appendChild(sec);
    });
    if (!shown && (ui.pending || ui.repos.size || ui.q)) frag.appendChild(el("p", "empty", "Ninguna tarea coincide con los filtros."));
    board.appendChild(frag);
  }

  render();

  // Conexión con el estado compartido
  (async function connect() {
    if (!window.claude || typeof window.claude.use !== "function") {
      setStatus("off", "Vista de solo lectura: abre el tablero en Claude para marcar tareas.");
      return;
    }
    try { user = await window.claude.use("user"); } catch (e) { user = null; }
    try { db = await window.claude.use("db"); } catch (e) { db = null; }
    if (!db) { setStatus("off", "Vista de solo lectura: inicia sesión para ver y marcar el avance del equipo."); return; }
    if (user) {
      try { myId = await user.id(); } catch (e) { myId = null; }
      let w = null; try { w = await user.can("data.write"); } catch (e) { w = null; }
      canWrite = w !== false;
    } else { canWrite = true; }

    let settled = false;
    const timer = setTimeout(() => { if (!settled) setStatus("warn", "No se pudo cargar el estado compartido todavía. Lo que ves puede no estar al día."); }, 10000);
    db.collection("estado").onSnapshot(snap => {
      snap.docs.forEach(d => { if (!saving.has(d.id)) state[d.id] = d.data(); });
      snap.docChanges().forEach(c => { if (c.type === "removed") delete state[c.doc.id]; });
      if (!snap.metadata.fromCache) {
        settled = true; clearTimeout(timer);
        setStatus("live", canWrite ? "En vivo · los cambios se guardan para todo el equipo" : "En vivo · solo lectura para tu nivel de acceso");
      }
      render();
    }, err => {
      settled = true; clearTimeout(timer);
      setStatus("off", "Se perdió la conexión con el estado compartido. Recarga la página para reconectar.");
    });
  })();

  // Navegación por hash
  function goHash() {
    const id = location.hash.slice(1);
    if (!id) return;
    const t = document.getElementById(id);
    if (t) t.scrollIntoView({ block: "start" });
  }
  window.addEventListener("hashchange", goHash);
  setTimeout(goHash, 0);
})();
</script>
